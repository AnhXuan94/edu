<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Trang chủ - Mobile Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<!-- SIDEBAR -->
<aside class="sidebar">
    <div class="sidebar-logo">
        <span class="mobile">Mobile</span> <span class="shop">SHOP</span>
    </div>
    <ul class="sidebar-menu">
        <li><a th:href="@{/}" class="active"><i class="fas fa-th-large"></i> Dashboard</a></li>
        <li><a th:href="@{/customers}"><i class="fas fa-users"></i> Customer</a></li>
        <li><a th:href="@{/products}"><i class="fas fa-box"></i> Products</a></li>
        <li><a th:href="@{/invoices}"><i class="fas fa-file-invoice"></i> Invoices</a></li>
    </ul>
    <div class="sidebar-footer">
        <a th:href="@{/admin/logout}"><i class="fas fa-sign-out-alt"></i> Sign out</a>
    </div>
</aside>

<!-- MAIN CONTENT -->
<div class="main-content">
    <div class="page-header">
        <h2>Chào mừng đến với hệ thống quản lý</h2>
    </div>
    <p class="text-muted">Xin chào, <strong th:text="${session.adminUsername}">Admin</strong>!</p>

    <div class="dashboard-cards">
        <div class="dashboard-card card-blue">
            <h3><i class="fas fa-box text-primary"></i> Sản phẩm</h3>
            <p>Quản lý thông tin điện thoại, tồn kho.</p>
            <a th:href="@{/products}" class="btn btn-primary-orange">Đi đến</a>
        </div>
        <div class="dashboard-card card-green">
            <h3><i class="fas fa-users text-success"></i> Khách hàng</h3>
            <p>Quản lý thông tin khách hàng.</p>
            <a th:href="@{/customers}" class="btn btn-primary-orange">Đi đến</a>
        </div>
        <div class="dashboard-card card-orange">
            <h3><i class="fas fa-file-invoice text-warning"></i> Hóa đơn</h3>
            <p>Quản lý đơn hàng và doanh thu.</p>
            <a th:href="@{/invoices}" class="btn btn-primary-orange">Đi đến</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
