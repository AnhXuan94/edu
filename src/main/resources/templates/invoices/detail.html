<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết hóa đơn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">Mobile Shop</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/products}">Sản phẩm</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/customers}">Khách hàng</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/invoices}">Hóa đơn</a></li>
            </ul>
            <a th:href="@{/admin/logout}" class="btn btn-outline-light btn-sm">Đăng xuất</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2 class="mb-4">Chi tiết hóa đơn #<span th:text="${invoice.id}"></span></h2>

    <!-- Thông tin hóa đơn -->
    <div class="card mb-4">
        <div class="card-body">
            <div class="row">
                <div class="col-md-6">
                    <p><strong>Khách hàng:</strong> <span th:text="${invoice.customer?.name}"></span></p>
                    <p><strong>Số điện thoại:</strong> <span th:text="${invoice.customer?.phone}"></span></p>
                    <p><strong>Ngày tạo:</strong> <span th:text="${#temporals.format(invoice.createdAt, 'dd/MM/yyyy HH:mm')}"></span></p>
                </div>
                <div class="col-md-6">
                    <p><strong>Tổng tiền:</strong> <span class="text-danger" th:text="${#numbers.formatDecimal(invoice.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span></p>
                    <p><strong>Trạng thái:</strong>
                        <span th:if="${invoice.status.name() == 'PENDING'}" class="badge bg-warning">Chờ xác nhận</span>
                        <span th:if="${invoice.status.name() == 'CONFIRMED'}" class="badge bg-primary">Đã xác nhận</span>
                        <span th:if="${invoice.status.name() == 'SHIPPED'}" class="badge bg-success">Đã giao</span>
                        <span th:if="${invoice.status.name() == 'CANCELLED'}" class="badge bg-danger">Đã hủy</span>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Bảng chi tiết sản phẩm -->
    <h4 class="mb-3">Danh sách sản phẩm</h4>
    <table class="table table-bordered">
        <thead class="table-dark">
        <tr>
            <th>STT</th>
            <th>Sản phẩm</th>
            <th>Đơn giá</th>
            <th>Số lượng</th>
            <th>Thành tiền</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="detail, iterStat : ${details}">
            <td th:text="${iterStat.index + 1}"></td>
            <td th:text="${detail.product?.name}"></td>
            <td th:text="${#numbers.formatDecimal(detail.unitPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
            <td th:text="${detail.quantity}"></td>
            <td th:text="${#numbers.formatDecimal(detail.unitPrice * detail.quantity, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/invoices}" class="btn btn-secondary">Quay lại</a>
</div>
</body>
</html>
