<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tạo hóa đơn mới</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">Mobile Shop</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/products}">Sản phẩm</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/customers}">Khách hàng</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/invoices}">Hóa đơn</a></li>
            </ul>
            <a th:href="@{/admin/logout}" class="btn btn-outline-light btn-sm">Đăng xuất</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2 class="mb-4">Tạo hóa đơn mới</h2>

    <form th:action="@{/invoices/create}" method="post">
        <!-- Chọn khách hàng -->
        <div class="mb-3">
            <label class="form-label">Khách hàng</label>
            <select name="customerId" class="form-select" required>
                <option value="">-- Chọn khách hàng --</option>
                <option th:each="customer : ${customers}"
                        th:value="${customer.id}"
                        th:text="${customer.name + ' - ' + customer.phone}"></option>
            </select>
        </div>

        <!-- Danh sách sản phẩm động -->
        <div class="mb-3">
            <label class="form-label">Sản phẩm</label>
            <div id="product-list">
                <div class="row mb-2 product-row">
                    <div class="col-md-6">
                        <select name="productIds" class="form-select" required>
                            <option value="">-- Chọn sản phẩm --</option>
                            <option th:each="product : ${products}"
                                    th:value="${product.id}"
                                    th:text="${product.name + ' - ' + product.price + 'đ (Tồn: ' + product.stock + ')'}"></option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <input type="number" name="quantities" class="form-control" placeholder="Số lượng" min="1" required>
                    </div>
                    <div class="col-md-2">
                        <button type="button" class="btn btn-danger" onclick="removeProductRow(this)">Xóa</button>
                    </div>
                </div>
            </div>
            <button type="button" class="btn btn-secondary mt-2" onclick="addProductRow()">+ Thêm sản phẩm</button>
        </div>

        <div class="mt-4">
            <button type="submit" class="btn btn-success">Tạo hóa đơn</button>
            <a th:href="@{/invoices}" class="btn btn-secondary ms-2">Hủy</a>
        </div>
    </form>
</div>

<script>
    // Hàm thêm dòng sản phẩm mới
    function addProductRow() {
        var productList = document.getElementById('product-list');
        var newRow = document.createElement('div');
        newRow.className = 'row mb-2 product-row';
        newRow.innerHTML = `
            <div class="col-md-6">
                <select name="productIds" class="form-select" required>
                    <option value="">-- Chọn sản phẩm --</option>
                    <!-- Các option sẽ được thêm tự động khi submit -->
                </select>
            </div>
            <div class="col-md-4">
                <input type="number" name="quantities" class="form-control" placeholder="Số lượng" min="1" required>
            </div>
            <div class="col-md-2">
                <button type="button" class="btn btn-danger" onclick="removeProductRow(this)">Xóa</button>
            </div>
        `;
        productList.appendChild(newRow);
    }

    // Hàm xóa dòng sản phẩm
    function removeProductRow(button) {
        button.closest('.product-row').remove();
    }
</script>
</body>
</html>
