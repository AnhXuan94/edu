# ============================================================
# CẤU HÌNH ỨNG DỤNG QUẢN LÝ CỬA HÀNG ĐIỆN THOẠI
# ============================================================

# Cổng server (truy cập qua http://localhost:8080)
server.port=8080

# ============================================================
# CẤU HÌNH KẾT NỐI DATABASE MYSQL
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/phone_management?useSSL=false&serverTimezone=UTC&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# CẤU HÌNH JPA/HIBERNATE
# ============================================================
# update: Tự động cập nhật schema theo entity class
spring.jpa.hibernate.ddl-auto=update
# Hiển thị SQL ra console (hữu ích khi debug)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================================================
# CẤU HÌNH THYMELEAF
# ============================================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ============================================================
# CẤU HÌNH UPLOAD FILE ẢNH
# ============================================================
# Kích thước tối đa của 1 file upload (10MB)
spring.servlet.multipart.max-file-size=10MB
# Kích thước tối đa của toàn bộ request (10MB)
spring.servlet.multipart.max-request-size=10MB

# ============================================================
# LOGGING
# ============================================================
logging.level.ra.edu=DEBUG
logging.level.org.hibernate.SQL=DEBUG